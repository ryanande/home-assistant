# -----------------------------------------------------------------------------
# rv-home-assistant umbrella chart values
# -----------------------------------------------------------------------------

global:
  # IANA timezone injected as TZ into every container.
  timezone: America/Chicago
  # Default StorageClass for PVCs. K3s ships "local-path" (hostPath under
  # /var/lib/rancher/k3s/storage). Empty string = cluster default.
  storageClass: local-path

# -----------------------------------------------------------------------------
# Physical CAN bus. vehicle_bridge (re)configures it at RV-C's 250 kbit/s on
# start; the host's systemd-networkd config (host/) brings it up at boot.
# -----------------------------------------------------------------------------
canBus:
  interfaceName: can0

# -----------------------------------------------------------------------------
# LibreCoach (https://librecoach.com), run without the Home Assistant
# Supervisor. Its own code runs unmodified; the chart supplies what the
# add-on environment normally provides:
#   - "core-mosquitto"     Service alias for the broker (hard-coded upstream)
#   - "supervisor"         nginx shim proxying /core/* to Home Assistant's API
#   - SUPERVISOR_TOKEN     a Home Assistant long-lived token from a Secret
#   - /data/options.json   the add-on options, rendered from `options` below
#   - retained librecoach/config/* toggles the add-on's run.sh would publish
# -----------------------------------------------------------------------------
librecoach:
  enabled: true
  # One version for both vehicle_bridge and the Node-RED flows: both are taken
  # from ghcr.io/backroads4me/<arch>-librecoach:<version>. Upgrade = bump this.
  version: "1.7.2"
  arch: amd64               # amd64 (mini PC) or aarch64
  pullPolicy: IfNotPresent

  # Secret (key "token") holding a Home Assistant long-lived access token,
  # exposed to LibreCoach as SUPERVISOR_TOKEN. Created after HA onboarding with
  # scripts/set-ha-token.sh - never committed. Pods start without it; HA API
  # features (entity export/import, notifications, geo) wait until it exists.
  haTokenSecret: librecoach-ha-token

  # LibreCoach add-on options (same keys as the add-on's Configuration tab).
  # can_interface is filled in from canBus.interfaceName.
  options:
    victron_enabled: false
    hughes_enabled: false       # Bluetooth: needs HA Bluetooth access (not wired up yet)
    microair_enabled: false     # Bluetooth: needs HA Bluetooth access (not wired up yet)
    microair_email: ""
    microair_password: ""
    geo_enabled: false
    geo_device_tracker_primary: ""
    geo_device_tracker_secondary: ""
    geo_update_threshold: 10
    rvc_time_sync_enabled: false
    debug_logging: false
    # Upstream's built-in defaults. The broker allows anonymous in-cluster
    # clients, so these are sent but not checked.
    mqtt_user: librecoach
    mqtt_pass: One23four

  victron:
    # IP of the Cerbo GX (give it a DHCP reservation). The flows connect to
    # "venus.local", an mDNS name pods cannot resolve, so this is added to the
    # Node-RED pod's /etc/hosts. Also set options.victron_enabled: true.
    gxAddress: ""

  vehicleBridge:
    # Host network: SocketCAN interfaces live in the host's network namespace.
    privileged: true
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 192Mi

  nodeRed:
    image:
      repository: nodered/node-red
      tag: "5.0.7"              # same Node-RED version as the HA Node-RED add-on
      pullPolicy: IfNotPresent
    storageSize: 1Gi
    storageClass: ""            # empty = global.storageClass
    # LibreCoach owns the flows: on every start they are replaced by the
    # bundled version (changed files are backed up to /config/librecoach-backups).
    # Set true to keep your own edits, like the add-on option of the same name.
    preventFlowUpdates: false
    service:
      # ClusterIP: the editor controls your RV, so it is not exposed by default.
      # Open it with: kubectl -n rv-lab port-forward svc/rv-home-assistant-node-red 1880
      type: ClusterIP
      port: 1880
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        memory: 512Mi

  supervisorShim:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: "1.29-alpine"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        memory: 64Mi

  # Used for the retained config-toggle publisher (needs mosquitto_pub).
  mqttClientImage: eclipse-mosquitto:2

# -----------------------------------------------------------------------------
# Home Assistant Core
# -----------------------------------------------------------------------------
homeAssistant:
  enabled: true
  image:
    repository: ghcr.io/home-assistant/home-assistant
    # "stable" floats; pin to e.g. "2026.9.3" for reproducible rollouts.
    tag: stable
    pullPolicy: IfNotPresent

  # PVC mounted at /config (configuration.yaml, .storage, database).
  storageSize: 10Gi
  storageClass: ""          # empty = global.storageClass
  accessMode: ReadWriteOnce
  existingClaim: ""         # set to reuse a PVC created outside the chart

  service:
    # K3s ServiceLB (klipper-lb) binds LoadBalancer ports on the node IP, so
    # HA is reachable at http://<mini-pc-ip>:8123 without hostNetwork.
    type: LoadBalancer
    port: 8123
    annotations: {}

  # Extra env for the HA container.
  extraEnv: []

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  probes:
    enabled: true

  nodeSelector: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Mosquitto (embedded subchart: charts/mosquitto). Keys under this block are
# passed straight to the subchart.
# -----------------------------------------------------------------------------
mosquitto:
  enabled: true
  image:
    repository: eclipse-mosquitto
    # Major-version pin; "latest" also works but can jump majors unannounced.
    tag: "2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 1883
  # Anonymous access is limited to in-cluster clients (ClusterIP only).
  allowAnonymous: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""        # empty = global.storageClass
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
