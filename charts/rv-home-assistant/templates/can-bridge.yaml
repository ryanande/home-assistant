{{- if .Values.canBridge.enabled }}
{{- $c := .Values.canBridge }}
{{- $name := printf "%s-can-bridge" (include "rvha.fullname" .) }}
# -----------------------------------------------------------------------------
# LibreCoach CAN <-> MQTT bridge
#
# Runs in the HOST network namespace so it can open a raw SocketCAN socket on
# the host's can0. Because hostNetwork pods bind host ports and host devices,
# exactly one replica may run per node -> replicas: 1 + Recreate strategy.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rvha.labels" (dict "ctx" $ "component" "can-bridge") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rvha.selectorLabels" (dict "ctx" $ "component" "can-bridge") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rvha.selectorLabels" (dict "ctx" $ "component" "can-bridge") | nindent 8 }}
    spec:
      hostNetwork: {{ $c.hostNetwork }}
      # Without ClusterFirstWithHostNet a hostNetwork pod uses the node's
      # resolv.conf and cannot resolve the in-cluster Mosquitto Service.
      dnsPolicy: {{ $c.dnsPolicy }}
      # The bridge never talks to the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      {{- if $.Values.canBus.configureInterface }}
      initContainers:
        # Optional: (re)configure the CAN link from inside the cluster. The
        # host-side systemd-networkd config is preferred; see host/ in repo.
        - name: can-link-setup
          image: {{ .Values.canBus.initImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ip link set {{ .Values.canBus.interfaceName }} down || true
              ip link set {{ .Values.canBus.interfaceName }} type can bitrate {{ int .Values.canBus.bitrate }} restart-ms 100
              ip link set {{ .Values.canBus.interfaceName }} up
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
      {{- end }}
      containers:
        - name: can-bridge
          image: {{ printf "%s:%s" $c.image.repository $c.image.tag | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: CAN_INTERFACE
              value: {{ .Values.canBus.interfaceName | quote }}
            - name: CAN_BITRATE
              value: {{ int .Values.canBus.bitrate | quote }}
            - name: MQTT_HOST
              value: {{ include "rvha.mqttHost" . | quote }}
            - name: MQTT_PORT
              value: {{ int $c.mqtt.port | quote }}
            - name: MQTT_TOPIC_PREFIX
              value: {{ $c.mqtt.topicPrefix | quote }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            privileged: {{ $c.securityContext.privileged }}
            # privileged already grants all caps; listing them explicitly
            # keeps the pod working if you later set privileged: false.
            allowPrivilegeEscalation: {{ $c.securityContext.privileged }}
            capabilities:
              {{- toYaml $c.securityContext.capabilities | nindent 14 }}
          {{- if $c.hostDev.enabled }}
          volumeMounts:
            - name: host-dev
              mountPath: /dev
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
      {{- if $c.hostDev.enabled }}
      volumes:
        - name: host-dev
          hostPath:
            path: {{ $c.hostDev.path }}
            type: Directory
      {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
