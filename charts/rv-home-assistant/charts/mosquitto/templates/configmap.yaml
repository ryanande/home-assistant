apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosquitto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    # Listen on all pod interfaces (2.x default is loopback only).
    listener {{ .Values.service.port }} 0.0.0.0
    allow_anonymous {{ .Values.allowAnonymous }}
    persistence {{ .Values.persistence.enabled }}
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_timestamp_format %Y-%m-%dT%H:%M:%S
