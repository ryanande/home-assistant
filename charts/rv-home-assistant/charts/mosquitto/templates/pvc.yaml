{{- if .Values.persistence.enabled }}
# Retained messages / session state (incl. MQTT discovery configs).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mosquitto.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- $sc := default (.Values.global.storageClass | default "") .Values.persistence.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
